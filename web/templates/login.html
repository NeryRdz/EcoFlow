<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ecoflow</title>
    <link rel="icon" type="image/png" href="static/images/Logo.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #11ad1e;
            --primary-dark: #05571a;
            --primary-light: #46d334;
            --secondary: #3bf6b8;
            --accent: #f5d20b;
            --dark: #1f2937;
            --light: #f8fafc;
            --gray: #6b7280;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e8f5e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .btn-volver {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(17, 173, 30, 0.3);
            z-index: 100;
        }

        .btn-volver:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 173, 30, 0.4);
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(17, 173, 30, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .login-header {
            background: var(--gradient);
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .login-form {
            padding: 2.5rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(17, 173, 30, 0.1);
        }

        .form-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            transition: color 0.3s ease;
        }

        .form-group input:focus + i {
            color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(17, 173, 30, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 173, 30, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            color: var(--gray);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .admin-info {
            background: rgba(245, 210, 11, 0.1);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--dark);
        }

        .admin-info strong {
            color: var(--primary-dark);
        }

        /* Mensajes Flash */
        .flash-messages {
            position: fixed;
            top: 72%;
            right: 1rem;
            z-index: 1000;
            max-width: 400px;
        }

        .alert {
            padding: 1rem 1.5rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideInRight 0.3s ease-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .alert-success {
            background: rgba(17, 173, 30, 0.1);
            color: var(--primary-dark);
            border: 1px solid var(--primary);
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            color: #721c24;
            border: 1px solid #dc3545;
        }

        .fa-eye, .fa-eye-slash {
            margin-left: 88%;
            cursor: pointer;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        /* Tablets */
        @media (max-width: 1024px) {
            .login-container {
                max-width: 90%;
            }
        }

        /* Móviles grandes */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
                align-items: flex-start;
            }
            
            .btn-volver {
                top: 0;
                left: 0;
                width: 100%;
                justify-content: center;
            }
            
            .login-container {
                max-width: 100%;
                margin-top: 4rem;
            }
            
            .login-header {
                padding: 1.5rem;
            }
            
            .login-header h1 {
                font-size: 1.7rem;
            }
            
            .login-form {
                padding: 1.5rem;
            }
        }

        /* Móviles pequeños */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            
            .login-header {
                padding: 1rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-form {
                padding: 1rem;
            }
            
            .form-group {
                margin-bottom: 1.5rem;
            }
            
            .form-group input {
                padding: 0.8rem 0.8rem 0.8rem 2.5rem;
                font-size: 0.9rem;
            }
            
            .form-group i {
                left: 0.8rem;
            }
            
            .btn-login {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
            
            .flash-messages {
                top: 0;
                right: 0;
                max-width: 100%;
                margin-top: 36rem;
            }
        }
    </style>
</head>

<body>
    <a href="{{ url_for('index') }}" class="btn-volver">
        <i class="fas fa-arrow-left"></i> Volver al Inicio
    </a>

    <!-- Mensajes Flash -->
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i class="fas fa-{% if category == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>Iniciar Sesión</h1>
            <p>Accede a tu cuenta de Ecoflow</p>
        </div>
        
       

        <form method="POST" class="login-form">
            <div class="form-group">
                <input type="email" name="CorreoElectronico" placeholder="Correo Electrónico" required>
                <i class="fas fa-envelope"></i>
            </div>
            
            <div class="form-group">
                <input type="password" name="Contra" id="pass" placeholder="Contraseña" required>
                <i class="fas fa-lock"></i>
                <i class="fas fa-eye toggle-pass" onclick="togglePassword()"></i>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
            
            <div class="login-footer">
                ¿No tienes una cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
            </div>
        </form>
    </div>
    <script>
        function togglePassword() {
            const input = document.getElementById("pass");
            const icon = document.querySelector(".toggle-pass");

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash"); // cambia a ojo tachado
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye"); // vuelve al ojo normal
            }
        }
    </script>
</body>
</html>
